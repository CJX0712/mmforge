[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmforge"
version = "0.1.0"
description = "MMForge · 跨模态对比学习系统：CCA 基线 + 非线性对比学习双编码器 + MMFuse 融合旗舰"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "晨星" }]
dependencies = ["numpy>=1.26", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["ruff==0.16.10", "pytest>=7", "pytest-cov>=4"]

[tool.setuptools]
package-dir = { mmforge = "." }
packages = ["mmforge", "mmforge.core", "mmforge.data", "mmforge.multimodal", "mmforge.eval", "mmforge.pipeline"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q -W ignore::UserWarning"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF100"]
ignore = ["E501", "RUF015", "E402", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM", "F401"]
